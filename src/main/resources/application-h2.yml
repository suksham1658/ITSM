# Local / agent preview without SQL Server. Never use in uat or prod.
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:itsm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

itsm:
  ldap:
    url:
  storage:
    root: ${FILE_STORAGE_ROOT:/tmp/itsm-files}
  security:
    test-login-enabled: true
    preview-password: ${H2_PREVIEW_PASSWORD:}
