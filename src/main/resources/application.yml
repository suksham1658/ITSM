spring:
  application:
    name: IT Nexa
  config:
    # Passwords are NOT kept in the code. Each machine (your PC, the server) has its own file
    # D:\itsm-config\itsm-secrets.yml (template: config-template/itsm-secrets.yml); set ITSM_CONFIG_DIR to use
    # another folder. Values there override this file. Change a password = edit that file + restart.
    import: optional:file:${ITSM_CONFIG_DIR:D:/itsm-config}/itsm-secrets.yml
  datasource:
    url: ${DB_URL:jdbc:sqlserver://10.65.7.245:1865;databaseName=ITSM_PROD;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      # Sized for 1000+ users: a request holds a connection for milliseconds, so 30 covers the peak, and
      # 10 warm connections avoid opening new ones (slow over the network) on the first clicks of the day.
      maximum-pool-size: ${HIKARI_MAX_POOL:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: itsm-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        # All text columns are NVARCHAR/NCHAR (db/migration, db/install); map every String to them so
        # ddl-auto=validate expects nvarchar, and Unicode (e.g. Hindi) is stored correctly.
        use_nationalized_character_data: true
        # Load lazy associations of a list (requester, category, roles...) in batches, not one query each.
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        format_sql: false
    show-sql: false
  web:
    resources:
      # Browsers keep CSS/JS for a year; links carry a content hash (itsm-<hash>.css), so a new WAR
      # changes the URL and everybody gets the new file at once.
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/images/**
  flyway:
    # Off by default: production (10.65.7.245:1865, ITSM_PROD) is SQL Server 2012, which Flyway 9
    # Community refuses ("Flyway Teams Edition or SQL Server upgrade required"). The DBA installs the
    # schema once with database/install-itsm-portal.sql. On SQL Server 2016+ set FLYWAY_ENABLED=true.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    # Setting user/password makes Spring Boot give Flyway its own (unpooled) connection. The
    # migrations run SET NOCOUNT ON; on a pooled connection that setting leaked into the app, where
    # UPDATEs then reported -1 rows and Hibernate failed with "optimistic locking failed".
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  mail:
    # Company SMTP relay: port 25, no login, no TLS (ticket e-mails, see itsm.mail).
    host: ${MAIL_HOST:10.65.8.64}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8092}
  # Gzip pages, CSS and JS (embedded Tomcat only; on the server Tomcat set compression in conf/server.xml).
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,text/plain
    min-response-size: 2048
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
  health:
    # Login uses its own JNDI client (itsm.ldap.*), not Spring's LDAP connection, which points at
    # localhost:389; and outbound mail is not configured. Both checks would always report DOWN.
    ldap:
      enabled: false
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ITSM Portal
    phase: 9-gap-review
    java: 8
    spring-boot: 2.7.18

itsm:
  ldap:
    url: ${LDAP_URL:ldap://AUTHPDC.Authum.local:389}
    base-dn: ${LDAP_BASE_DN:dc=Authum,dc=local}
    bind-dn: ${LDAP_BIND_DN:70902907@Authum.local}
    bind-password: ${LDAP_BIND_PASSWORD}
    user-search-filter: "${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}"
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:}
    employee-id-attribute: ${LDAP_EMPLOYEE_ID_ATTRIBUTE:employeeID}
    manager-attribute: ${LDAP_MANAGER_ATTRIBUTE:manager}
    account-search-filter: "${LDAP_ACCOUNT_SEARCH_FILTER:(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={0}*)(employeeID={0})(displayName=*{0}*)))}"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  storage:
    type: ${FILE_STORAGE_TYPE:filesystem}
    root: ${FILE_STORAGE_ROOT:}
  mail:
    # E-mail to the requester when a request / incident is submitted and when it is closed.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@authum.com}
    from-name: ${MAIL_FROM_NAME:IT Service Desk}
    # Link in the mail, e.g. http://<server-ip>:8090/itsm-portal (blank = no link)
    portal-url: ${ITSM_PORTAL_URL:}
  security:
    test-login-enabled: false
    preview-password: ${H2_PREVIEW_PASSWORD:}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
    # First System Administrator on a new database: AD username(s) or employee no(s), comma separated.
    # Applied at login only while nobody holds SYSTEM_ADMINISTRATOR; ignored afterwards.
    bootstrap-admins: ${ITSM_BOOTSTRAP_ADMINS:}

logging:
  level:
    root: INFO
    com.nbfc.itsm: INFO
    org.springframework.security: WARN
