spring:
  application:
    name: ITSM Portal
  datasource:
    url: ${DB_URL:jdbc:sqlserver://AUTHDDRN0102\AUTHUM;databaseName=ItsmPortal;encrypt=true;trustServerCertificate=true}
    username: 'sa'
    password: 'pass@123'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: itsm-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    # Setting user/password makes Spring Boot give Flyway its own (unpooled) connection. The
    # migrations run SET NOCOUNT ON; on a pooled connection that setting leaked into the app, where
    # UPDATEs then reported -1 rows and Hibernate failed with "optimistic locking failed".
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8092}
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
  health:
    # Login uses its own JNDI client (itsm.ldap.*), not Spring's LDAP connection, which points at
    # localhost:389; and outbound mail is not configured. Both checks would always report DOWN.
    ldap:
      enabled: false
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ITSM Portal
    phase: 9-gap-review
    java: 8
    spring-boot: 2.7.18

itsm:
  ldap:
    url: ${LDAP_URL:ldap://AUTHPDC.Authum.local:389}
    base-dn: ${LDAP_BASE_DN:dc=Authum,dc=local}
    bind-dn: ${LDAP_BIND_DN:70902907@Authum.local}
    bind-password: ${LDAP_BIND_PASSWORD:D!v!t@2024}
    user-search-filter: "${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}"
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:}
    employee-id-attribute: ${LDAP_EMPLOYEE_ID_ATTRIBUTE:employeeID}
    manager-attribute: ${LDAP_MANAGER_ATTRIBUTE:manager}
    account-search-filter: "${LDAP_ACCOUNT_SEARCH_FILTER:(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={0}*)(employeeID={0})(displayName=*{0}*)))}"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  storage:
    type: ${FILE_STORAGE_TYPE:filesystem}
    root: ${FILE_STORAGE_ROOT:}
  mail:
    from: ${MAIL_FROM:}
  security:
    test-login-enabled: false
    preview-password: ${H2_PREVIEW_PASSWORD:}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
    # First System Administrator on a new database: AD username(s) or employee no(s), comma separated.
    # Applied at login only while nobody holds SYSTEM_ADMINISTRATOR; ignored afterwards.
    bootstrap-admins: ${ITSM_BOOTSTRAP_ADMINS:}

logging:
  level:
    root: INFO
    com.nbfc.itsm: INFO
    org.springframework.security: WARN
