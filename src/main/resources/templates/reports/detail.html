<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body>
<div id="sidebarBackdrop" data-action="close-mobile-sidebar"></div>
<div id="app">
<aside th:replace="fragments/sidebar :: sidebar(${nav})"></aside>
<div id="mainCol">
<header th:replace="fragments/header :: header"></header>
<main id="pageContent">
<div th:replace="fragments/alerts :: flash"></div>
    <div class="page-header">
      <div>
        <a th:replace="fragments/back :: back(href=@{/reports}, label='Back to Reports')"></a>
        <div class="breadcrumb">Authum IT Nexa / <a th:href="@{/reports}">Reports</a> / <span th:text="${report.title}">Report</span></div>
        <h1 th:text="${report.title}">Report</h1>
        <p class="page-sub" th:text="${report.description}">Description</p>
      </div>
      <div class="page-header-actions no-print">
        <a class="btn btn-outline btn-sm" th:href="@{/reports/{code}.xls(code=${report.code},from=${from},to=${to},typeId=${typeId},status=${status},departmentId=${departmentId},categoryId=${categoryId},priority=${priority})}"><i class="fa-regular fa-file-excel"></i> Export Excel</a>
        <a class="btn btn-outline btn-sm" th:href="@{/reports/{code}.csv(code=${report.code},from=${from},to=${to},typeId=${typeId},status=${status},departmentId=${departmentId},categoryId=${categoryId},priority=${priority})}"><i class="fa-regular fa-file-lines"></i> Export CSV</a>
        <button type="button" class="btn btn-outline btn-sm" data-action="print"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
    <form class="filter-bar card card-pad no-print" method="get" th:action="@{/reports/{code}(code=${report.code})}">
      <input class="form-control" type="date" name="from" th:value="${from}"/>
      <input class="form-control" type="date" name="to" th:value="${to}"/>
      <select class="form-control" name="typeId">
        <option value="">All types</option>
        <option th:each="t : ${types}" th:value="${t.ticketTypeId}" th:text="${t.name}" th:selected="${typeId != null and typeId == t.ticketTypeId}"></option>
      </select>
      <select class="form-control" name="status">
        <option value="">All statuses</option>
        <option th:selected="${status == 'Draft'}">Draft</option>
        <option th:selected="${status == 'Pending Approval'}">Pending Approval</option>
        <option th:selected="${status == 'Approved'}">Approved</option>
        <option th:selected="${status == 'Assigned'}">Assigned</option>
        <option th:selected="${status == 'In Progress'}">In Progress</option>
        <option th:selected="${status == 'On Hold'}">On Hold</option>
        <option th:selected="${status == 'Resolved'}">Resolved</option>
        <option th:selected="${status == 'Closed'}">Closed</option>
        <option th:selected="${status == 'Rejected'}">Rejected</option>
      </select>
      <select class="form-control" name="departmentId">
        <option value="">All departments</option>
        <option th:each="d : ${departments}" th:value="${d.departmentId}" th:text="${d.name}" th:selected="${departmentId != null and departmentId == d.departmentId}"></option>
      </select>
      <select class="form-control" name="categoryId">
        <option value="">All categories</option>
        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.name}" th:selected="${categoryId != null and categoryId == c.categoryId}"></option>
      </select>
      <select class="form-control" name="priority">
        <option value="">All priorities</option>
        <option th:selected="${priority == 'Critical'}">Critical</option>
        <option th:selected="${priority == 'High'}">High</option>
        <option th:selected="${priority == 'Medium'}">Medium</option>
        <option th:selected="${priority == 'Low'}">Low</option>
      </select>
      <button type="submit" class="btn btn-outline">Apply</button>
    </form>
    <p class="page-sub" th:if="${report.note != null}" th:text="${report.note}">Note</p>
    <div class="card" style="margin-bottom:18px;" th:if="${report.chart != null}">
      <div class="chart-box">
        <canvas id="reportChart" height="220" data-chart="reportChartJson"></canvas>
        <script type="application/json" id="reportChartJson" th:text="${chartJson}">{}</script>
      </div>
    </div>
    <div class="card" th:if="${report.rows != null and !report.rows.empty}">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
          <tr>
            <th th:each="c : ${report.columns}" th:text="${c}">Col</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="row : ${report.rows}">
            <td th:each="cell : ${row.cells}" th:text="${cell}">-</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="pager no-print" th:if="${report.totalPages > 1}">
        <a class="btn btn-outline btn-sm" th:if="${report.hasPrevious}"
           th:href="@{/reports/{code}(code=${report.code},from=${from},to=${to},typeId=${typeId},status=${status},departmentId=${departmentId},categoryId=${categoryId},priority=${priority},page=${report.page - 1})}">Previous</a>
        <span class="page-sub" th:text="'Page ' + ${report.page + 1} + ' of ' + ${report.totalPages} + ' · ' + ${report.totalRows} + ' rows'">Page</span>
        <a class="btn btn-outline btn-sm" th:if="${report.hasNext}"
           th:href="@{/reports/{code}(code=${report.code},from=${from},to=${to},typeId=${typeId},status=${status},departmentId=${departmentId},categoryId=${categoryId},priority=${priority},page=${report.page + 1})}">Next</a>
      </div>
    </div>
    <div th:if="${report.rows == null or report.rows.empty}">
      <div th:replace="fragments/alerts :: empty(title='No rows', body='Nothing matches these filters in your scope.')"></div>
    </div>
</main>
</div>
</div>
<div th:replace="fragments/modal :: modal"></div>
<th:block th:replace="fragments/scripts :: scripts"></th:block>
</body>
</html>
