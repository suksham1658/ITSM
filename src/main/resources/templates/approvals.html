<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head(${pageTitle})"></head>
<body>
<div id="sidebarBackdrop" data-action="close-mobile-sidebar"></div>
<div id="app">
<aside th:replace="fragments/sidebar :: sidebar(${nav})"></aside>
<div id="mainCol">
<header th:replace="fragments/header :: header"></header>
<main id="pageContent">
<div th:replace="fragments/alerts :: flash"></div>
    <div class="page-header">
      <div>
        <div class="breadcrumb">Authum IT Nexa / <span th:text="${pageTitle}">Approvals</span></div>
        <h1 th:text="${pageTitle}">Approvals</h1>
        <p class="page-sub">Every ticket waiting for you: approvals, IT Service Desk assignment and implementor work. Remarks are mandatory on Approve, Reject and Send Back.</p>
      </div>
    </div>
    <div class="card" th:if="${items != null and !items.empty}">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Number</th><th>Subject</th><th>Your step</th><th>Type</th><th>Status</th><th>Priority</th><th>Requester</th><th>Created</th></tr></thead>
          <tbody>
          <tr th:each="i : ${items}" th:with="t=${i.ticket}">
            <td class="cell-id"><a class="cell-link" th:href="@{/tickets/{id}(id=${t.ticketId})}" th:text="${t.publicNumber}">n</a></td>
            <td th:text="${t.subject}">s</td>
            <td><span class="badge badge-flow" th:text="${i.action}">Approve</span>
              <div class="text-muted" th:text="${@ui.stageLabel(i.stepLabel)}">step</div></td>
            <td th:text="${t.ticketType.name}">t</td>
            <td><span class="badge" th:classappend="${@ui.ticketStatusClass(t.statusCode)}" th:text="${t.statusCode}">st</span></td>
            <td th:text="${t.priorityCode}">p</td>
            <td th:text="${t.requester.displayName}">r</td>
            <td class="mono cell-date" th:text="${@ui.dateTime(t.createdAtUtc)}">date</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div th:if="${items == null or items.empty}">
      <div th:replace="fragments/alerts :: empty(title=${pageTitle}, body=${emptyMessage})"></div>
    </div>
</main>
</div>
</div>
<div th:replace="fragments/modal :: modal"></div>
<th:block th:replace="fragments/scripts :: scripts"></th:block>
</body>
</html>
