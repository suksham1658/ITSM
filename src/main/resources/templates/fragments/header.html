<header id="topHeader" xmlns:th="http://www.thymeleaf.org" th:fragment="header">
    <button type="button" class="header-burger" data-action="toggle-sidebar" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
    <div class="header-spacer"></div>
    <div class="header-right" th:if="${currentUser != null}">
        <form class="role-switcher" th:if="${currentUser.roleSwitchAvailable}" th:action="@{/session/active-role}" method="post">
            <select name="role" data-autosubmit="true" aria-label="View portal as role">
                <option value="" th:selected="${currentUser.activeRoleCode == null}">View as: All my roles</option>
                <option th:each="r : ${currentUser.assignedRoles}" th:value="${r.code}"
                        th:selected="${r.code == currentUser.activeRoleCode}"
                        th:text="'View as: ' + ${r.name}">View as: Employee</option>
            </select>
            <noscript><button type="submit" class="btn btn-outline btn-xs">Switch</button></noscript>
        </form>
        <button type="button" class="header-icon-btn" data-action="toggle-notif-panel" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
        </button>
        <button type="button" class="user-menu" data-action="toggle-user-panel" aria-haspopup="true">
            <div class="avatar" th:text="${currentUser.initials}">IT</div>
            <div class="u-info">
                <div class="u-name" th:text="${currentUser.displayName}">User</div>
                <div class="u-role" th:text="${currentUser.primaryRoleLabel}">Employee</div>
            </div>
            <i class="fa-solid fa-chevron-down" style="font-size:10px;color:var(--slate-400)"></i>
        </button>
    </div>
    <div class="dropdown-panel" id="notifPanel" role="menu">
        <div class="dropdown-head"><h4>Notifications</h4></div>
        <div class="dropdown-body">
            <div class="empty-state" style="padding:20px"><p>No notifications.</p></div>
        </div>
    </div>
    <div class="dropdown-panel user-menu-panel" id="userPanel" th:if="${currentUser != null}">
        <div class="umenu-profile">
            <div class="avatar" th:text="${currentUser.initials}">IT</div>
            <div>
                <div class="u-name" th:text="${currentUser.displayName}">User</div>
                <div class="u-id" th:text="${currentUser.employeeNo}">E1</div>
            </div>
        </div>
        <div class="umenu-divider"></div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="umenu-item" style="width:100%;text-align:left;color:var(--danger);background:none;border:0;">
                <i class="fa-solid fa-arrow-right-from-bracket" style="color:var(--danger)"></i> Logout
            </button>
        </form>
    </div>
</header>
