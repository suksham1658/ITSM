# ITSM Portal - secrets for ONE machine. NEVER commit a filled-in copy.
#
# Copy this file to  D:\itsm-config\itsm-secrets.yml  (on your PC and on the server) and fill in the values.
# Another folder: set the environment variable ITSM_CONFIG_DIR to that folder.
# The application reads it at every start (Eclipse / java -jar / external Tomcat).
# Password changed (every 3 months)? Edit this file, then restart the application. No rebuild.
#
# Restrict the folder: only administrators and the account that runs Tomcat should be able to read it.

spring:
  datasource:
    # SQL Server login for the ITSM database (ideally a dedicated login such as itsm_app, not sa)
    username: CHANGE_ME
    password: CHANGE_ME
    # Optional: a different database for this machine
    # url: jdbc:sqlserver://10.65.7.245:1865;databaseName=ITSM_PROD;encrypt=true;trustServerCertificate=true

itsm:
  ldap:
    # AD service account used to look users up and to unlock accounts
    bind-dn: 70902907@Authum.local
    bind-password: CHANGE_ME
